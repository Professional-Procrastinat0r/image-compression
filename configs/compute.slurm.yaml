provider: slurm
num_workers: 3
deployment:
  variables:
    OPENBLAS_NUM_THREADS: '1'
    OMP_NUM_THREADS: '1'
options:
  cleanup: on_success
  queue: normal
  worker_cores: 1
  worker_processes: 1
  worker_memory: 4GB
  walltime: 00:30:00
  startup_timeout_sec: 1800
  job_extra:
  - --account=allusers
  - --qos=normal
storage:
  metadata:
    type: firestore
    gcp_project: exp-ops
  mounts:
    code:
      type: git
      url: https://github.com/Professional-Procrastinat0r/image-compression
    input:
      type: gcs
      bucket: exp-ops-image-compression-inputs
      prefix: kodak
      gcp_project: exp-ops
    cache:
      type: s3
      bucket: expops-test-bucket-755933694771-ap-southeast-1-an
      prefix: image-compression/cache
      region: ap-southeast-1
      profile: expops
    artefact:
      type: s3
      bucket: expops-test-bucket-755933694771-ap-southeast-1-an
      prefix: image-compression/artefact
      region: ap-southeast-1
      profile: expops
