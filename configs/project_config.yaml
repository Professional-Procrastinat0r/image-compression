experiment:
  pipeline:
    process_adjlist: 'jpeg_q30 compression_report

      jpeg_q60 compression_report

      jpeg_q90 compression_report

      webp_q30 compression_report

      webp_q60 compression_report

      webp_q90 compression_report'
    processes:
    - name: jpeg_q30
      code: main.benchmark
      environment: compression-env
      parameters:
        codec: JPEG
        quality: 30
        repeats: 5
    - name: jpeg_q60
      code: main.benchmark
      environment: compression-env
      parameters:
        codec: JPEG
        quality: 60
        repeats: 5
    - name: jpeg_q90
      code: main.benchmark
      environment: compression-env
      parameters:
        codec: JPEG
        quality: 90
        repeats: 5
    - name: webp_q30
      code: main.benchmark
      environment: compression-env
      parameters:
        codec: WEBP
        quality: 30
        repeats: 5
    - name: webp_q60
      code: main.benchmark
      environment: compression-env
      parameters:
        codec: WEBP
        quality: 60
        repeats: 5
    - name: webp_q90
      code: main.benchmark
      environment: compression-env
      parameters:
        codec: WEBP
        quality: 90
        repeats: 5
    - name: compression_report
      code: main.compression_report
      environment: compression-env
      type: chart
      chart_type: static
      probe_paths:
        jpeg_q30: //process[@name='jpeg_q30']
        jpeg_q60: //process[@name='jpeg_q60']
        jpeg_q90: //process[@name='jpeg_q90']
        webp_q30: //process[@name='webp_q30']
        webp_q60: //process[@name='webp_q60']
        webp_q90: //process[@name='webp_q90']
