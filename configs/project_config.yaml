metadata:
  name: image-compression
  description: Kodak JPEG and WebP size-quality-time experiment
  version: 0.1.0
scripts:
  main: code/src/experiment.py
environment:
  compression-env:
    venv: code/requirements.txt
reproducibility:
  random_seed: 42
data:
  inputs:
    kodim01:
      path: input/kodim01.png
      mode: stream
